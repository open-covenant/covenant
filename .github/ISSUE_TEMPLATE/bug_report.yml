name: Bug report
description: Something is broken. For security issues, use SECURITY.md instead.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check existing issues and the README for the affected component.
        **Security-sensitive bugs (key exposure, capability bypass, audit-log forgery, fund movement) must go through the private advisory flow — see [SECURITY.md](../../SECURITY.md).**

  - type: input
    id: component
    attributes:
      label: Component
      description: Which crate, binary, or surface?
      placeholder: "covenantd, covenant-permissions, landing site, programs/settlement, etc."
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / version
      description: Output of `git rev-parse HEAD` or the tagged release.
      placeholder: "abc1234 or v0.1.0"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, logs, and any audit-event output.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal commands or a failing test. The shorter, the better.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, Node version (for the landing site), and any external services involved (Ollama, Solana RPC, etc.).
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: This is not a security vulnerability (if it is, I will close this and use the private advisory flow)
          required: true
        - label: I've searched existing issues
          required: true
