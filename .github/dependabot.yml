version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/*"
      tooling:
        patterns:
          - "eslint*"
          - "prettier"
          - "typescript"
          - "@types/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"

  - package-ecosystem: "cargo"
    directory: "/agent-os"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
