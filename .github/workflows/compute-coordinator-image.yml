name: compute-coordinator-image

on:
  push:
    branches: [deploy/compute-coordinator]
    paths:
      - .github/workflows/compute-coordinator-image.yml
      - agent-os/**
      - deploy/Dockerfile.compute-coordinator
      - deploy/compute-coordinator-entrypoint.sh
  workflow_dispatch:

concurrency:
  group: compute-coordinator-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/open-covenant/covenant/compute-coordinator

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'open-covenant/covenant' && github.ref == 'refs/heads/deploy/compute-coordinator'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          cache-binary: false
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: image
        uses: docker/build-push-action@601a80b39c9405e50806ae38af30926f9d957c47 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.compute-coordinator
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/open-covenant/covenant
          platforms: linux/amd64
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: record digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "${IMAGE_NAME}:${COMMIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
