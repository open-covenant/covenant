name: compute-x402-image
on:
  push:
    branches: [codex/compute-x402-release, deploy/compute-coordinator]
    paths:
      - .github/workflows/compute-x402-image.yml
      - deploy/Dockerfile.compute-x402
      - deploy/compute-x402/**
      - deploy/compute-canary-watchdog*
      - services/compute-x402-facilitator/**
      - services/compute-inference-provider/**
      - sdk/compute-x402-client/**
      - agent-os/**
  workflow_dispatch:
    inputs:
      smoke_image:
        description: Existing immutable image for smoke only; leave empty to build
        required: false
        type: string
      smoke_revision:
        description: Full source revision embedded in the existing image
        required: false
        type: string
concurrency:
  group: compute-x402-${{ github.event_name == 'workflow_dispatch' && inputs.smoke_image != '' && 'smoke' || 'image' }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  image:
    if: github.repository == 'open-covenant/covenant' && (github.event_name != 'workflow_dispatch' || inputs.smoke_image == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.20.0
      - name: Verify payment and provider boundaries
        run: |
          npm ci --omit=dev --ignore-scripts --prefix services/compute-x402-facilitator
          npm test --prefix services/compute-x402-facilitator
          npm test --prefix services/compute-inference-provider
          node --test deploy/compute-canary-watchdog.test.mjs deploy/compute-x402/runtime.test.mjs deploy/compute-x402/smoke.test.mjs
          node --check deploy/compute-x402/supervisor.mjs
          sh -n deploy/compute-x402/entrypoint.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          cache-binary: false
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@601a80b39c9405e50806ae38af30926f9d957c47
        id: image
        with:
          context: .
          file: deploy/Dockerfile.compute-x402
          build-args: COVENANT_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/open-covenant/covenant
          platforms: linux/amd64
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: ghcr.io/open-covenant/covenant/compute-node-public:x402-${{ github.sha }}
      - name: Qualify immutable image with persistent volume and no paid dispatch
        timeout-minutes: 10
        env:
          SMOKE_IMAGE: ghcr.io/open-covenant/covenant/compute-node-public@${{ steps.image.outputs.digest }}
          SMOKE_REVISION: ${{ github.sha }}
        run: node deploy/compute-x402/smoke.mjs
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/open-covenant/covenant/compute-node-public@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  smoke-existing:
    if: github.repository == 'open-covenant/covenant' && github.event_name == 'workflow_dispatch' && inputs.smoke_image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.20.0
      - name: Verify isolated smoke harness
        run: node --test deploy/compute-x402/smoke.test.mjs
      - name: Qualify existing immutable image without rebuilding
        env:
          SMOKE_IMAGE: ${{ inputs.smoke_image }}
          SMOKE_REVISION: ${{ inputs.smoke_revision }}
        run: node deploy/compute-x402/smoke.mjs
