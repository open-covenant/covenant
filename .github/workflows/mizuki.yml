name: mizuki

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: mizuki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: mizuki
      MIZUKI_TEST_DATABASE_URL: postgres://postgres:mizuki@127.0.0.1:5432/mizuki_core
      MIZUKI_SIGNER_TEST_DATABASE_URL: postgres://postgres:mizuki@127.0.0.1:5432/mizuki_signer
      MIZUKI_UPDATER_TEST_DATABASE_URL: postgres://postgres:mizuki@127.0.0.1:5432/mizuki_updater
      MIZUKI_DEPLOY_TEST_DATABASE_URL: postgres://postgres:mizuki@127.0.0.1:5432/mizuki_deployment
      MIZUKI_DEPLOY_TEST_DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.31.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: create isolated test databases
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE mizuki_core;
          CREATE DATABASE mizuki_signer;
          CREATE DATABASE mizuki_updater;
          CREATE DATABASE mizuki_deployment;
          SQL
      - name: verify application and deployment artifacts
        env:
          MIZUKI_SKIP_ESCROW: '1'
        run: infra/mizuki/verify.sh
      - name: initialize updater recovery fixture
        run: |
          node --input-type=module <<'NODE'
          import { PostgresUpgradeRepository } from './services/mizuki-updater/dist/postgres.js';

          const repository = new PostgresUpgradeRepository(process.env.MIZUKI_UPDATER_TEST_DATABASE_URL);
          try {
            await repository.migrate();
          } finally {
            await repository.close();
          }
          NODE
      - name: initialize deployment recovery fixture
        run: |
          node --input-type=module <<'NODE'
          import { PostgresOperationStore } from './services/mizuki-deployment-controller/dist/store.js';

          const store = new PostgresOperationStore({
            connectionString: process.env.MIZUKI_DEPLOY_TEST_DATABASE_URL,
            sslMode: 'disable',
            connectionTimeoutMs: 10000,
            maxConnections: 2,
          });
          try {
            await store.migrate();
          } finally {
            await store.close();
          }
          NODE
      - name: exercise database backup restore
        run: |
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_core --data-only --no-owner --no-privileges --file=/tmp/mizuki-core.data.sql
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_signer --data-only --no-owner --no-privileges --file=/tmp/mizuki-signer.data.sql
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_updater --data-only --no-owner --no-privileges --file=/tmp/mizuki-updater.data.sql
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_deployment --data-only --no-owner --no-privileges --file=/tmp/mizuki-deployment.data.sql
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_core --format=custom --file=/tmp/mizuki-core.dump
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_signer --format=custom --file=/tmp/mizuki-signer.dump
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_updater --format=custom --file=/tmp/mizuki-updater.dump
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_deployment --format=custom --file=/tmp/mizuki-deployment.dump
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE mizuki_core_restore;
          CREATE DATABASE mizuki_signer_restore;
          CREATE DATABASE mizuki_updater_restore;
          CREATE DATABASE mizuki_deployment_restore;
          SQL
          pg_restore -h 127.0.0.1 -U postgres -d mizuki_core_restore --exit-on-error /tmp/mizuki-core.dump
          pg_restore -h 127.0.0.1 -U postgres -d mizuki_signer_restore --exit-on-error /tmp/mizuki-signer.dump
          pg_restore -h 127.0.0.1 -U postgres -d mizuki_updater_restore --exit-on-error /tmp/mizuki-updater.dump
          pg_restore -h 127.0.0.1 -U postgres -d mizuki_deployment_restore --exit-on-error /tmp/mizuki-deployment.dump
          test "$(psql -h 127.0.0.1 -U postgres -d mizuki_core_restore -Atc "SELECT count(*) FROM mizuki_schema_migrations WHERE component = 'core'")" = '1'
          test "$(psql -h 127.0.0.1 -U postgres -d mizuki_signer_restore -Atc "SELECT count(*) FROM mizuki_schema_migrations WHERE component = 'policy-signer'")" = '1'
          test "$(psql -h 127.0.0.1 -U postgres -d mizuki_updater_restore -Atc "SELECT count(*) FROM mizuki_updater_migrations")" = '3'
          test "$(psql -h 127.0.0.1 -U postgres -d mizuki_deployment_restore -Atc "SELECT count(*) FROM mizuki_deployment_migrations")" = '2'
          test "$(psql -h 127.0.0.1 -U postgres -d mizuki_deployment_restore -Atc "SELECT count(*) FROM pg_trigger WHERE tgname = 'mizuki_deployment_events_append_only' AND NOT tgisinternal")" = '1'
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_core_restore --data-only --no-owner --no-privileges --file=/tmp/mizuki-core-restored.data.sql
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_signer_restore --data-only --no-owner --no-privileges --file=/tmp/mizuki-signer-restored.data.sql
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_updater_restore --data-only --no-owner --no-privileges --file=/tmp/mizuki-updater-restored.data.sql
          pg_dump -h 127.0.0.1 -U postgres -d mizuki_deployment_restore --data-only --no-owner --no-privileges --file=/tmp/mizuki-deployment-restored.data.sql
          sed -i '/^\\restrict /d; /^\\unrestrict /d' /tmp/mizuki-*.data.sql
          cmp /tmp/mizuki-core.data.sql /tmp/mizuki-core-restored.data.sql
          cmp /tmp/mizuki-signer.data.sql /tmp/mizuki-signer-restored.data.sql
          cmp /tmp/mizuki-updater.data.sql /tmp/mizuki-updater-restored.data.sql
          cmp /tmp/mizuki-deployment.data.sql /tmp/mizuki-deployment-restored.data.sql

  escrow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: solanafoundation/solana-verifiable-build:4.0.0@sha256:0b4e3716fad9ca4b4aac3e3f977f43aad93a18c22296c0c0f44fc22e644bdd68
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: install test utilities
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl ripgrep
          rustup component add rustfmt clippy
      - name: install pinned Solana verification CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output /usr/local/bin/solana-verify \
            https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.5.0/solana-verify-0.5.0-linux
          echo '411c7bc4cd6001f215ca21ab7de5dd22140175fef69e0e483c4768018f651eb6  /usr/local/bin/solana-verify' | sha256sum --check --strict
          chmod 0755 /usr/local/bin/solana-verify
          solana-verify --version
      - name: build and exercise the SBPFv2 artifact
        run: programs/mizuki-escrow/scripts/test.sh
      - name: prepare escrow release evidence
        run: |
          program_root=programs/mizuki-escrow
          release_dir="$program_root/target/release-evidence"
          artifact="$program_root/target/deploy/mizuki_escrow_program.so"

          mkdir -p "$release_dir"
          cp "$artifact" "$release_dir/"
          cp "$program_root/Cargo.lock" "$program_root/Cargo.toml" "$release_dir/"
          cp "$program_root/abi/mizuki-escrow-v1.json" "$release_dir/"

          (
            cd "$release_dir"
            sha256sum mizuki_escrow_program.so > SHA256SUMS
          )
          solana-verify get-executable-hash "$artifact" > "$release_dir/SOLANA_EXECUTABLE_HASH"
          cargo-build-sbf --version > "$release_dir/BUILD_TOOLCHAIN"
          solana-verify --version > "$release_dir/SOLANA_VERIFY_VERSION"
          printf '2\n' > "$release_dir/SBPF_VERSION"
          printf '0x2\n' > "$release_dir/ELF_FLAGS"
          printf '%s\n' "$GITHUB_SHA" > "$release_dir/GIT_COMMIT"

          cat "$release_dir/SHA256SUMS"
          cat "$release_dir/SOLANA_EXECUTABLE_HASH"
      - name: upload immutable escrow release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mizuki-escrow-${{ github.sha }}
          path: programs/mizuki-escrow/target/release-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
