name: release-guard

# Dedicated release for the covguard binary (the covenant-guard wedge). Separate
# from the covenant release so it carries its own tag cadence and install path.
on:
  push:
    tags:
      - "covguard-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: covguard-darwin-arm64
          # macOS/arm64 only for now: the OS sandbox is macOS-specific, so a
          # Linux binary would ship with a core ring missing. Linux arrives with
          # the bubblewrap backend; Intel macOS builds from source.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: agent-os

      - name: Build covguard
        working-directory: agent-os
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p covenant-guard

      - name: Stage tarball contents
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="dist/${ASSET}"
          mkdir -p "${STAGE}"
          cp "agent-os/target/${TARGET}/release/covguard" "${STAGE}/"
          strip "${STAGE}/covguard" || true
          cp LICENSE "${STAGE}/"
          cp agent-os/crates/covenant-guard/README.md "${STAGE}/README.md"

      - name: Tarball
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          cd dist
          tar -czf "${ASSET}.tar.gz" "${ASSET}"
          shasum -a 256 "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  sign-and-publish:
    name: sign and publish
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts and build combined checksums
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -exec cp {} out/ \;
          cd out
          cat *.tar.gz.sha256 > checksums.txt
          rm -f *.tar.gz.sha256
          ls -la

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a
        with:
          cosign-release: v2.4.1

      - name: Sign artifacts (keyless)
        working-directory: out
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for f in *.tar.gz checksums.txt; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done
          ls -la

      - name: Publish release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes "Signed release of the covguard binary. Verify with cosign using the .sig/.pem alongside each asset." \
            *.tar.gz *.sig *.pem checksums.txt
