name: sign-release-artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (must already exist)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  sign-release-subject:
    name: sign release evidence
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_TAG}" ]; then
            echo "name=${EVENT_TAG}" >> "$GITHUB_OUTPUT"
          elif [ -n "${INPUT_TAG}" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no release tag available (neither inputs.tag nor github.event.release.tag_name was set)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.tag.outputs.name }}
          persist-credentials: false

      - name: Resolve release commit
        id: commit
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          echo "sha=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p out
          cd out
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.tar.gz' \
            --pattern 'checksums.txt'
          ls -la

      - name: Verify artifact checksums
        working-directory: out
        run: |
          set -euo pipefail
          sha256sum --ignore-missing --check checksums.txt

      - name: Generate release subject manifest
        env:
          TAG: ${{ steps.tag.outputs.name }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readdirSync, readFileSync, statSync, writeFileSync } from "node:fs";

            const tag = process.env.TAG;
            const commit = process.env.COMMIT;
            const repository = process.env.REPOSITORY;
            const dir = "out";

            if (!tag) throw new Error("TAG env required");
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error("COMMIT must be 40 hex chars");
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) throw new Error("REPOSITORY must be owner/repo");

            const files = readdirSync(dir)
              .filter((name) => name.endsWith(".tar.gz") || name === "checksums.txt")
              .sort();

            if (files.length === 0) throw new Error("no release artifacts downloaded");

            const artifacts = files.map((filename) => {
              const path = `${dir}/${filename}`;
              const bytes = readFileSync(path);
              const sha256 = createHash("sha256").update(bytes).digest("hex");
              const sizeBytes = statSync(path).size;
              const name = filename === "checksums.txt"
                ? "checksums"
                : filename.replace(/\.tar\.gz$/, "");
              return { name, filename, sha256, sizeBytes };
            });

            const subject = {
              schema: "covenant.provenance.release.v1",
              generatedAt: new Date().toISOString(),
              subject: {
                kind: "release_bundle",
                repository,
                releaseId: tag,
                tag,
                commit,
                artifacts,
              },
              validation: [
                { command: "sha256sum --ignore-missing --check checksums.txt", status: "passed" },
              ],
            };

            writeFileSync("out/release-subject.json", JSON.stringify(subject, null, 2) + "\n");
            console.log(`release-subject.json: ${artifacts.length} artifacts`);
          '
          cat out/release-subject.json

      - name: Fetch release evidence from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          path: evidence-main
          persist-credentials: false
          sparse-checkout: |
            docs/provenance/release-scopes
            docs/provenance/audit-reports

      - name: Stage release evidence
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          SCOPE_SRC="evidence-main/docs/provenance/release-scopes/${TAG}.json"
          REPORT_SRC="evidence-main/docs/provenance/audit-reports/${TAG}.json"
          if [ ! -f "${SCOPE_SRC}" ]; then
            echo "::error::docs/provenance/release-scopes/${TAG}.json is missing on main, so release-scope signing and audit-root signing are blocked. Generate the manifest with the release-scope tooling and commit it to main before pushing the tag (see docs/provenance/release-scopes/README.md)."
            exit 1
          fi
          if [ ! -f "${REPORT_SRC}" ]; then
            echo "::error::docs/provenance/audit-reports/${TAG}.json is missing on main, so audit-root signing is blocked. Capture 'covenant audit verify --json' output for this release and commit it to main before pushing the tag (see docs/provenance/audit-reports/README.md)."
            exit 1
          fi
          cp "${SCOPE_SRC}" out/release-scope.json
          cp "${REPORT_SRC}" out/audit-report.json

      - name: Generate audit-root attestation
        env:
          TAG: ${{ steps.tag.outputs.name }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          node agent-os/scripts/provenance.mjs audit-root write \
            --report out/audit-report.json \
            --release "${TAG}" \
            --release-subject out/release-subject.json \
            --release-scope out/release-scope.json \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${COMMIT}" \
            --validation "sha256sum --ignore-missing --check checksums.txt=passed" \
            --out out/audit-root.json
          node agent-os/scripts/provenance.mjs audit-root verify --file out/audit-root.json
          cat out/audit-root.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign release evidence (keyless OIDC)
        working-directory: out
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature release-subject.json.sig \
            --output-certificate release-subject.json.pem \
            release-subject.json
          cosign sign-blob --yes \
            --output-signature release-scope.json.sig \
            --output-certificate release-scope.json.pem \
            release-scope.json
          cosign sign-blob --yes \
            --output-signature audit-root.json.sig \
            --output-certificate audit-root.json.pem \
            audit-root.json
          ls -la release-subject.json* release-scope.json* audit-root.json*

      - name: Upload signed release evidence to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            out/release-subject.json \
            out/release-subject.json.sig \
            out/release-subject.json.pem \
            out/release-scope.json \
            out/release-scope.json.sig \
            out/release-scope.json.pem \
            out/audit-root.json \
            out/audit-root.json.sig \
            out/audit-root.json.pem
