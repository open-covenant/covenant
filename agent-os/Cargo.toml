[workspace]
resolver = "2"
members = [
    "crates/covenant-types",
    "crates/covenant-manifest",
    "crates/covenant-ipc",
    "crates/covenant-router",
    "crates/covenant-runtime",
    "crates/covenant-memory",
    "crates/covenant-settlement",
    "crates/covenant-llm",
    "crates/covenant-tools",
    "crates/covenant-identity",
    "crates/covenant-audit",
    "crates/covenant-permissions",
    "crates/covenant-mcp",
    "crates/covenant-a2a",
    "crates/covenant-peer-auth",
    "crates/covenant-budget",
    "crates/covenantd",
    "crates/covenant",
    "crates/covenant-tui",
    "agents/research",
    "programs/settlement",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["Covenant contributors"]
repository = "https://github.com/open-covenant/covenant"
homepage = "https://opencovenant.org"
readme = "README.md"

[profile.release]
overflow-checks = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
toml = "0.8"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
bs58 = "0.5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "process", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2"
rand = "0.8"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
