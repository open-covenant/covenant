[package]
name = "covenant-a2a"
version = "0.1.0"
description = "Agent-to-agent task and result envelopes for Covenant. Async Mailbox trait with an in-memory backend and a durable JSONL-backed implementation; leased task queue, receiver-side idempotency cache, repair commands, and an opt-in auto-retry policy."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
covenant-mcp = { path = "../covenant-mcp" }
covenant-types = { path = "../covenant-types" }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
