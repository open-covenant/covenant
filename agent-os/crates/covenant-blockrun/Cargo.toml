[package]
name = "covenant-blockrun"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Trust overlay for BlockRun's x402 API: captures a paid call round-trip and emits a hash-bound Covenant receipt binding intent, served model, and settlement."

[dependencies]
covenant-mcp = { path = "../covenant-mcp" }
covenant-x402 = { path = "../covenant-x402" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"

[dev-dependencies]
async-trait = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[[example]]
name = "live_verified_call"
path = "examples/live_verified_call.rs"
