[package]
name = "covenant-compute-lease-signer"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Covenant contributors"]
repository = "https://github.com/open-covenant/covenant"
description = "Signing sidecar for the Covenant Compute lease meter. Opens, ticks, concludes and voids a GPU lease on Solana and its MagicBlock rollup so the coordinator never links a chain client or holds a key."

# Standalone workspace, for the same reason as covenant-x402-signer: the
# Solana dependency tree resolves on its own instead of unifying with the
# agent-os workspace, and the keys stay in a separate process.
[workspace]

[[bin]]
name = "covenant-compute-lease-signer"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bincode = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-compute-budget-interface = "3"
solana-sdk = "4"
spl-associated-token-account = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time"] }
# Held at 1.0.0 as in covenant-x402-signer: 1.1.0 makes a conversion in
# spl-token-2022-interface ambiguous (E0283).
solana-zero-copy = "=1.0.0"
