[package]
name = "covenant-evm-signer"
version = "0.1.0"
description = "Experimental EAS off-chain statement encoder for publisher-authenticated audit-root and caller-supplied event-metric projections. Not wired to publication; signatures authenticate bytes, not claims."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "covenant-evm-signer"
path = "src/main.rs"

[dependencies]
covenant-identity = { path = "../covenant-identity" }
covenant-attestation = { path = "../covenant-attestation" }
covenant-audit = { path = "../covenant-audit" }
k256 = { workspace = true }
sha3 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
