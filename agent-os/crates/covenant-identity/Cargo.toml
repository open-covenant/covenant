[package]
name = "covenant-identity"
version = "0.1.0"
description = "Local ed25519 identity for Covenant. Keypair generation, on-disk persistence, signing, and verification — the same key is reused to sign on-chain settlement transactions, so there is no second keypair system."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
covenant-types = { path = "../covenant-types" }
bs58 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
