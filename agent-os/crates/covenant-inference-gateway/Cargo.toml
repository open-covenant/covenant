[package]
name = "covenant-inference-gateway"
version = "0.1.0"
edition = "2021"
description = "Routing gateway for a Solana verifiable open-model inference network: node registry, outbound mTLS tunnel pool, and an OpenAI-compatible surface that routes by model and trust floor"

# Detached from the agent-os workspace on purpose, like the sibling inference
# crates: the transport tree (hyper/rustls/tokio-rustls) stays out of the parent
# lockfile until covenantd wires the network in, and the ring-pinned rustls here
# must not fight the parent's provider selection.
[workspace]

[lib]
name = "covenant_inference_gateway"
path = "src/lib.rs"

[[bin]]
name = "covenant-inference-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive"] }
covenant-inference-node = { path = "../covenant-inference-node" }
covenant-inference-protocol = { path = "../covenant-inference-protocol" }
ed25519-dalek = "2.1.1"
hex = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
