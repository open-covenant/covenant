[package]
name = "covenant-inference-protocol"
version = "0.1.0"
edition = "2021"
description = "Identity, telemetry, trust-class and receipt protocol for a Solana verifiable open-model inference network"

# Detached from the agent-os workspace on purpose: keeps the inference-network
# crypto tree out of the parent lockfile until covenantd wires it in.
[workspace]

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
ed25519-dalek = "2.1.1"
getrandom = "0.2"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
