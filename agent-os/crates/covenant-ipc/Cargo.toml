[package]
name = "covenant-ipc"
version = "0.1.0"
description = "Length-prefixed JSON IPC shared by covenantd and the covenant CLI. 4-byte big-endian length prefix, frames bounded at 8 MB via MAX_FRAME, and a versioned protocol shape (PROTOCOL_VERSION 1 baseline, MAX_PROTOCOL_VERSION 2 reserved for streaming responses)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
covenant-types = { path = "../covenant-types" }
covenant-permissions = { path = "../covenant-permissions" }
covenant-mcp = { path = "../covenant-mcp" }
covenant-a2a = { path = "../covenant-a2a" }
covenant-audit = { path = "../covenant-audit" }
covenant-budget = { path = "../covenant-budget" }
covenant-peer-auth = { path = "../covenant-peer-auth" }
covenant-skills = { path = "../covenant-skills" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
