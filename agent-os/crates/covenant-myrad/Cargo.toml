[package]
name = "covenant-myrad"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Covenant provenance receipts for Myrad behavior signals. Binds an emitted signal to the set of Reclaim-verified contributions behind it, with integrity checks, and never touches raw data or PII."

[dependencies]
covenant-mcp = { path = "../covenant-mcp" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true }
