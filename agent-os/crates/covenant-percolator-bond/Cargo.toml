[package]
name = "covenant-percolator-bond"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stake-backed slash bond for Covenant-governed Percolator keepers. A keeper posts SOL into a bond PDA; anyone can submit signed evidence that the keeper executed an action outside its operator-signed scope and the bond is slashed atomically. Off-chain verifier + on-chain program source."

[features]
default = []
# Off-chain instruction builders against the bond program. Mirrors
# the `solana` feature on the keeper crate so dependents pick up
# both with a single switch.
solana = ["dep:solana-sdk"]
# Compile-time gate for the SBPF on-chain program. Off by default
# so the host build stays light; turn on for `cargo build-sbf`.
program = ["dep:solana-program"]
# `From<&KeeperScope> for BondScope` bridge. Pulls in the keeper
# crate; the bond crate stays scope-light by default so dependents
# that only build slash evidence don't pay the cost.
bridge = ["dep:covenant-percolator", "dep:bs58"]

[dependencies]
# Note: deliberately no `uuid`, `getrandom`, or other randomness-pulling
# transitive deps — this crate compiles to SBPF target via the
# `program` feature, where getrandom v0.4 breaks. AttestedAction's
# receipt_id is a raw [u8; 16] (the caller fills it from an off-chain
# uuid); bond state has no UUID.
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
solana-sdk = { workspace = true, optional = true }
solana-program = { workspace = true, optional = true }
covenant-percolator = { path = "../covenant-percolator", optional = true }
bs58 = { version = "0.5", optional = true }

[dev-dependencies]
proptest = "1"

[lib]
crate-type = ["rlib"]
