[package]
name = "covenant-percolator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Covenant-governed keeper agents for the Percolator perpetuals protocol — capability-scoped, budget-bounded, audit-logged. Permissionless liveness with verifiable behavior."

[features]
default = []
# Real on-chain client wires up once percolator-prog's IDL is in-tree.
# The default build is trait + mock + governance + tests, so the
# workspace stays light and the testable surface is what's shipped.
solana = []

[[bin]]
name = "covenant-percolator-keeper"
path = "src/bin/keeper.rs"

[dependencies]
covenant-types = { path = "../covenant-types" }
covenant-settlement = { path = "../covenant-settlement" }
covenant-budget = { path = "../covenant-budget" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

# The percolator-prog risk engine itself — Toly's account-local v16
# engine, depended on directly so the keeper's recovery and lifecycle
# logic uses HIS math, not a paraphrase. Pinned to the "Harden v16
# engine invariants" commit so the Kani-audited surface is what we
# compile against. `no_std`-clean; no Solana deps drag in.
percolator = { git = "https://github.com/aeyakovenko/percolator.git", rev = "323c9f270fcd16e1e9a67f93f4df5308fcc6a245" }
toml = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
proptest = "1"
