[package]
name = "covenant-percolator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Covenant-governed keeper agents for the Percolator perpetuals protocol — capability-scoped, budget-bounded, audit-logged. Permissionless liveness with verifiable behavior."

[features]
default = []
# Byte-locked off-chain instruction builders for the v16 keeper
# surface (program tags 5 / 43 / 44 / 45 / 63). Pulls in solana-sdk
# for `Instruction`/`AccountMeta`/`Pubkey` only — no RPC client.
solana = ["dep:solana-sdk"]
# Thin reference Sender + `RpcSender` for submitting + confirming
# keeper transactions against a real Solana RPC. Implies `solana`.
solana-rpc = ["solana", "dep:solana-client", "dep:bs58", "dep:bytemuck"]

[[bin]]
name = "covenant-percolator-keeper"
path = "src/bin/keeper.rs"

[dependencies]
covenant-types = { path = "../covenant-types" }
covenant-settlement = { path = "../covenant-settlement" }
covenant-budget = { path = "../covenant-budget" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

# The percolator-prog risk engine itself — Toly's account-local v16
# engine, depended on directly so the keeper's recovery and lifecycle
# logic uses HIS math, not a paraphrase. Pinned to the "Harden v16
# engine invariants" commit so the Kani-audited surface is what we
# compile against. `no_std`-clean; no Solana deps drag in.
percolator = { git = "https://github.com/aeyakovenko/percolator.git", rev = "323c9f270fcd16e1e9a67f93f4df5308fcc6a245" }
toml = { workspace = true }
tracing-subscriber = { workspace = true }

# Off-chain instruction builders behind the `solana` feature. The
# default build stays light; `--features solana` pulls in the SDK
# so `OnchainBuilder` can produce real `Instruction`s ready for a
# bundler / RPC client.
solana-sdk = { workspace = true, optional = true }
solana-client = { workspace = true, optional = true }
bs58 = { version = "0.5", optional = true }
bytemuck = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
proptest = "1"
