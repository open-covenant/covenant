[package]
name = "covenant-router"
version = "0.1.0"
description = "Intent router for Covenant. Loads agent manifests from `$COVENANT_HOME/agents/` and routes intents to registered agent capability cards via keyword-overlap matching."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
covenant-manifest = { path = "../covenant-manifest" }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
