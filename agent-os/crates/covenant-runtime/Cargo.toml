[package]
name = "covenant-runtime"
version = "0.1.0"
description = "Agent runtime for Covenant. Subprocess-based runner with a stdin/stdout JSON protocol and wall-clock timeouts."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
covenant-manifest = { path = "../covenant-manifest" }
covenant-router = { path = "../covenant-router" }
covenant-types = { path = "../covenant-types" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
