[package]
name = "covenant-runtime"
version = "0.1.0"
description = "Agent runtime for Covenant. Runner trait with SubprocessRunner, GvisorRunner, and HermesRunner implementations, a stdin/stdout JSON protocol, and per-task budget enforcement via projection-tick preempt and wall-clock backstop."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
covenant-manifest = { path = "../covenant-manifest" }
covenant-router = { path = "../covenant-router" }
covenant-types = { path = "../covenant-types" }
async-trait = { workspace = true }
futures = "0.3"
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
