[package]
name = "covenant-settlement-signer"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Covenant contributors"]
repository = "https://github.com/open-covenant/covenant"
description = "Standalone Covenant settlement batch-anchor signer. Runs as a sidecar to covenantd so the anchor-lang 0.31 / solana-sdk 2 dep tree and the anchoring key stay out of the daemon. Devnet-only guardrails; mainnet promotion is a separate human-gated step."

# Standalone workspace on purpose — a third Solana island beside the
# metaplex sidecar (solana-sdk 3) and the x402 sidecar (solana-sdk 4). This
# one pins solana-sdk 2 to match the settlement program's anchor-lang 0.31 /
# solana-sdk 2.2 world. Resolving each generation in its own subprocess
# workspace is what keeps the version split from unifying in one Cargo graph
# and out of the daemon's build.
[workspace]

[[bin]]
name = "covenant-settlement-signer"
path = "src/main.rs"

[dependencies]
covenant-settlement-program = { path = "../../programs/settlement", features = ["no-entrypoint"] }
anchor-lang = "0.31.1"
solana-sdk = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bincode = "1"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
