description = "Map a Covenant spend-scoped capability onto a Coinbase Spend Permission: the SpendPermissionManager EIP-712 struct, its pinned domain and typehash, a digest that reproduces the contract's getHash, and calldata builders for approveWithSignature/spend/revoke/getCurrentPeriod."
