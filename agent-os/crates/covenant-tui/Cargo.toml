[package]
name = "covenant-tui"
version = "0.1.0"
description = "Covenant terminal UI. Reads daemon state over the local IPC socket and renders intents, memory, audit, and capability views."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "covenant-tui"
path = "src/main.rs"

[lib]
name = "covenant_tui"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
bs58 = { workspace = true }
covenant-a2a = { path = "../covenant-a2a" }
covenant-audit = { path = "../covenant-audit" }
covenant-ipc = { path = "../covenant-ipc" }
covenant-permissions = { path = "../covenant-permissions" }
covenant-types = { path = "../covenant-types" }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.28"
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
covenant-identity = { path = "../covenant-identity" }
tempfile = { workspace = true }
