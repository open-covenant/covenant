[package]
name = "covenant-x402"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Outbound x402 client for Covenant agents — capability-scoped paid HTTP."

[features]
default = []
# Pulls in solana-sdk + SPL crates to enable the real on-chain
# payment signer and the xona-demo binary. Off by default so
# consumers that only want the types and the 402-loop don't pay
# the Solana dep-tree cost.
solana = [
    "dep:solana-sdk",
    "dep:solana-compute-budget-interface",
    "dep:spl-token",
    "dep:spl-associated-token-account",
    "dep:base64",
    "dep:bincode",
    "dep:tokio",
]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
url = "2"

# Solana signer + demo binary — optional, gated by the `solana` feature.
solana-sdk = { version = "4", optional = true }
solana-compute-budget-interface = { version = "3", optional = true }
spl-token = { version = "9", optional = true }
spl-associated-token-account = { version = "8", optional = true }
base64 = { version = "0.22", optional = true }
bincode = { version = "3.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
tempfile = { workspace = true }

[[bin]]
name = "xona-demo"
path = "src/bin/xona-demo.rs"
required-features = ["solana"]
