[package]
name = "covenant-x402"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Outbound x402 client for Covenant agents — capability-scoped paid HTTP."

[features]
default = []
# In-process EIP-1559 tx submitter (evm_tx::EvmRpc). Adds only a tokio timer
# for receipt polling; the sign/encode core is always built. The daemon turns
# this on so covenantd can broadcast its own chargeCall/release/refund txs.
evm-rpc = ["dep:tokio"]
# Pulls in solana-sdk + SPL crates to enable the real on-chain
# payment signer and the xona-demo binary. Off by default so
# consumers that only want the types and the 402-loop don't pay
# the Solana dep-tree cost.
solana = [
    "dep:solana-sdk",
    "dep:solana-compute-budget-interface",
    "dep:spl-token",
    "dep:spl-associated-token-account",
    "dep:bincode",
    "dep:tokio",
    "dep:sha2",
]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
url = "2"

# EVM (Base) signer support. EIP-3009 TransferWithAuthorization signed via
# EIP-712 is gasless and never touches an RPC, so it needs only secp256k1,
# keccak, base64, and a CSPRNG for the authorization nonce — a negligible
# tree next to the reqwest client the crate already carries. Kept out of the
# `solana` feature deliberately: it is always built so the default
# `cargo test -p covenant-x402` exercises the payment path.
base64 = "0.22"
k256 = { workspace = true }
sha3 = { workspace = true }
rand = { workspace = true }

# Solana signer + demo binary — optional, gated by the `solana` feature.
solana-sdk = { version = "4", optional = true }
solana-compute-budget-interface = { version = "3", optional = true }
spl-token = { version = "9", optional = true }
spl-associated-token-account = { version = "8", optional = true }
bincode = { version = "1.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
tempfile = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

[[bin]]
name = "xona-demo"
path = "src/bin/xona-demo.rs"
required-features = ["solana"]

[[bin]]
name = "covenant-x402-er-signer"
path = "src/bin/er-signer.rs"
required-features = ["solana"]

[[example]]
name = "ephemeral_live"
path = "examples/ephemeral_live.rs"
required-features = ["solana"]

# Live EVM submitter loop — hits a real RPC, so it needs the in-process
# submitter. Cargo skips it unless evm-rpc is on (the daemon build enables it).
[[test]]
name = "live_evm_tx"
required-features = ["evm-rpc"]

# Live generic x402 USDG settlement on Robinhood Chain 4663 — signs an EIP-3009
# authorization with EvmSigner and settles it with the in-process submitter, so
# it also needs evm-rpc.
[[test]]
name = "live_rh_usdg_settlement"
required-features = ["evm-rpc"]
