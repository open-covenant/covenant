[package]
name = "covenant"
version = "0.1.0"
description = "Covenant CLI. Submits intents to covenantd over the local IPC socket."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "covenant"
path = "src/main.rs"

[dependencies]
covenant-a2a = { path = "../covenant-a2a" }
covenant-audit = { path = "../covenant-audit" }
covenant-ipc = { path = "../covenant-ipc" }
covenant-manifest = { path = "../covenant-manifest" }
covenant-types = { path = "../covenant-types" }
covenant-mcp = { path = "../covenant-mcp" }
covenant-peer-auth = { path = "../covenant-peer-auth" }
covenant-permissions = { path = "../covenant-permissions" }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
