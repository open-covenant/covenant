[package]
name = "covenant"
version = "0.1.0"
description = "Covenant CLI for the local daemon. Submits intents and drives memory, capabilities, receipts, chain, audit, tools, A2A, and peer-registry surfaces over the local IPC socket."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "covenant"
path = "src/main.rs"

[dependencies]
covenant-a2a = { path = "../covenant-a2a" }
covenant-audit = { path = "../covenant-audit" }
covenant-ipc = { path = "../covenant-ipc" }
covenant-manifest = { path = "../covenant-manifest" }
covenant-memory = { path = "../covenant-memory" }
covenant-types = { path = "../covenant-types" }
covenant-mcp = { path = "../covenant-mcp" }
covenant-peer-auth = { path = "../covenant-peer-auth" }
covenant-permissions = { path = "../covenant-permissions" }
covenant-x402 = { path = "../covenant-x402" }
covenant-zauth = { path = "../covenant-zauth" }
covenant-sns = { path = "../covenant-sns" }
anyhow = { workspace = true }
async-trait = { workspace = true }
borsh = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-client = { workspace = true }
solana-sdk = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
bs58 = { workspace = true }
tempfile = { workspace = true }
