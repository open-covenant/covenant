[package]
name = "covenantd"
version = "0.1.0"
description = "Covenant daemon. Local-first coordination layer for agentic software, exposing intent dispatch, agent runtime, memory, identity, permissions, audit, and settlement over a Unix socket and an HTTP gateway."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "covenantd"
path = "src/main.rs"

[dependencies]
covenant-types = { path = "../covenant-types" }
covenant-ipc = { path = "../covenant-ipc" }
covenant-memory = { path = "../covenant-memory" }
covenant-audit = { path = "../covenant-audit" }
covenant-budget = { path = "../covenant-budget" }
covenant-identity = { path = "../covenant-identity" }
covenant-llm = { path = "../covenant-llm" }
covenant-manifest = { path = "../covenant-manifest" }
covenant-mcp = { path = "../covenant-mcp" }
covenant-a2a = { path = "../covenant-a2a" }
covenant-peer-auth = { path = "../covenant-peer-auth" }
covenant-permissions = { path = "../covenant-permissions" }
covenant-router = { path = "../covenant-router" }
covenant-runtime = { path = "../covenant-runtime" }
covenant-sap-bridge = { path = "../covenant-sap-bridge" }
covenant-settlement = { path = "../covenant-settlement" }
# Default features only — the solana signer + its dep tree stay out of
# the daemon build until the funding-key path lands behind its own
# feature in a separate change.
covenant-x402 = { path = "../covenant-x402" }
covenant-hyre = { path = "../covenant-hyre" }
covenant-syra = { path = "../covenant-syra" }
covenant-metaplex = { path = "../covenant-metaplex" }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bs58 = { workspace = true }
dotenvy = "0.15"
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
covenant-audit = { path = "../covenant-audit" }
covenant-hyre = { path = "../covenant-hyre" }
covenant-identity = { path = "../covenant-identity" }
covenant-llm = { path = "../covenant-llm" }
covenant-manifest = { path = "../covenant-manifest" }
covenant-peer-auth = { path = "../covenant-peer-auth" }
covenant-permissions = { path = "../covenant-permissions" }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# test-util enables `#[tokio::test(start_paused = true)]` so the SSE
# heartbeat test can advance virtual time instead of sleeping for 15s.
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
