[package]
name = "gitlawb-attest-demo"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "End-to-end demo: a Covenant agent producing an attested ref-update cert that any gitlawb node can verify."

# Standalone — sits next to the standalone bridge crates.
[workspace]

[[bin]]
name = "gitlawb-attest-demo"
path = "src/main.rs"

[dependencies]
covenant-gitlawb = { path = "../../crates/covenant-gitlawb" }
gitlawb-attest = { path = "../../crates/gitlawb-attest" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "2"
rand = "0.9"
serde_json = "1"
sha2 = "0.10"
