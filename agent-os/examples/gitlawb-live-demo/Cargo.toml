[package]
name = "gitlawb-live-demo"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Live end-to-end demo: a Covenant agent registering, creating a repo, and binding a verifiable covenant/exec/v1 attestation to a ref-update on a real gitlawb node."

# Standalone — sits next to the other gitlawb examples.
[workspace]

[[bin]]
name = "gitlawb-live-demo"
path = "src/main.rs"

[dependencies]
covenant-gitlawb = { path = "../../crates/covenant-gitlawb" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "2"
rand = "0.9"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
