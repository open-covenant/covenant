[package]
name = "gitlawb-push-demo"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "A Covenant agent makes a REAL signed git push to a gitlawb node; the node issues a ref cert; Covenant wraps that cert in a verifiable covenant/exec/v1 attestation."

# Standalone — sits next to the other gitlawb examples.
[workspace]

[[bin]]
name = "gitlawb-push-demo"
path = "src/main.rs"

[dependencies]
covenant-gitlawb = { path = "../../crates/covenant-gitlawb" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "2"
rand = "0.9"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
