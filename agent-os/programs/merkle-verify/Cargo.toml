[package]
name = "covenant-merkle-verify"
version = "0.1.0"
edition = "2021"
description = "Anchor-free Solana program that verifies merkle inclusion proofs for receipt batches on-chain. The verify kernel between the EVOLVE-BLOCK markers is the CU optimization target."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.2"

[dev-dependencies]
covenant-merkle = { path = "../../crates/covenant-merkle" }

# Standalone workspace: keep the SBF build isolated from the main agent-os
# workspace so cargo-build-sbf's platform-tools toolchain doesn't fight the
# host build (mirrors how the wasmtime fuel-runner stands alone).
[workspace]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
