[package]
name = "covenant-settlement-program"
version = "0.1.0"
description = "Covenant Solana protocol program for external COVNT staking, credits, escrow, and receipt anchors."
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "covenant_settlement_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Client-funded task escrow. Off by default: release_task is client-only with no
# provider recourse, so it is not safe to ship until the trust model is redesigned.
task-escrow = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
solana-security-txt = "1.1"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "2.2"
spl-token = "7.0"
spl-token-2022 = "6.0"
