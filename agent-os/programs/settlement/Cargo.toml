[package]
name = "covenant-settlement-program"
version = "0.1.0"
description = "Covenant on-chain settlement program. Anchor program for Solana implementing credit-mint and buyback PDAs."
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "covenant_settlement_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
