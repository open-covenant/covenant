[package]
name = "covenant-stake-program"
version = "0.1.0"
description = "Covenant Solana protocol program for $CVNT lock-tiered staking with SOL fee distribution and buy-and-lock treasury."
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "covenant_stake_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
solana-security-txt = "1.1"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "2.2"
spl-token = "7.0"
spl-token-2022 = "6.0"
spl-associated-token-account = "6.0"
