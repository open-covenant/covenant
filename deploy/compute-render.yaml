# Standalone blueprint for the private Covenant Compute control plane.
# It is deliberately separate from the repository's connected sandbox
# blueprint and does not auto-deploy.

services:
  - type: web
    name: covenant-compute
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeployTrigger: off
    rootDir: .
    dockerfilePath: ./deploy/Dockerfile.compute
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: covenant-compute-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: COVENANT_COMPUTE_BIND
        value: 0.0.0.0:10000
      - key: COVENANT_COMPUTE_DATABASE_PATH
        value: /data/compute.sqlite3
      - key: COVENANT_COMPUTE_PROVIDER
        value: vast
      - key: COVENANT_COMPUTE_BETA_TOKENS_JSON
        sync: false
      - key: COVENANT_VAST_API_KEY
        sync: false
      # Offer constraints. These repeat the crate defaults so the deployed
      # fleet is visible here; the crate README explains each one.
      - key: COVENANT_VAST_MAX_HOURLY_MICROS
        value: "1000000"
      - key: COVENANT_VAST_GPU_MODELS
        value: L40S,L40,RTX 6000Ada,RTX A6000,A40,A100 PCIE,A100 SXM4
      - key: COVENANT_VAST_MIN_GPU_MEMORY_MIB
        value: "40000"
      # Max per-GB transfer cost (USD micros) a host may charge. Hosts in this
      # class no longer offer free transfer, so 0 admits nothing.
      - key: COVENANT_VAST_MAX_INET_COST_MICROS
        value: "50000"
