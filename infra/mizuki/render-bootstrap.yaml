services:
  - type: pserv
    name: mizuki-policy-signer
    runtime: node
    repo: https://github.com/open-covenant/covenant
    branch: main
    plan: starter
    region: frankfurt
    numInstances: 1
    autoDeploy: false
    maxShutdownDelaySeconds: 120
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @covenant/mizuki-policy-signer build
    startCommand: pnpm --filter @covenant/mizuki-policy-signer start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIZUKI_SIGNER_HOST
        value: 0.0.0.0
      - key: MIZUKI_SIGNER_PORT
        value: 8792
      - key: MIZUKI_SIGNER_AUTH_TOKEN
        generateValue: true
      - key: MIZUKI_SIGNER_DATABASE_URL
        fromDatabase:
          name: mizuki-signer-postgres
          property: connectionString
      - key: MIZUKI_SIGNER_RPC_URL
        sync: false
      - key: MIZUKI_SIGNER_SECONDARY_RPC_URL
        sync: false
      - key: MIZUKI_SIGNER_RPC_TIMEOUT_MS
        value: '5000'
      - key: MIZUKI_REFUND_PRIVATE_KEY_JSON
        sync: false
      - key: MIZUKI_ESCROW_PRIVATE_KEY_JSON
        sync: false
      - key: MIZUKI_SIGNER_GITHUB_APP_ID
        sync: false
      - key: MIZUKI_SIGNER_GITHUB_PRIVATE_KEY
        sync: false
      - key: MIZUKI_SIGNER_REVIEW_BASE_URL
        value: https://api.usepod.ai
      - key: MIZUKI_SIGNER_REVIEW_API_KEY
        sync: false
      - key: MIZUKI_SIGNER_REVIEW_MODEL
        value: deepseek-v4-flash
      - key: MIZUKI_SIGNER_REVIEW_MIN_BALANCE
        value: '4000000'
      - key: MIZUKI_SIGNER_REVIEW_MAX_INPUT_PRICE_MICROUNITS
        value: '200000'
      - key: MIZUKI_SIGNER_REVIEW_MAX_OUTPUT_PRICE_MICROUNITS
        value: '400000'
      - key: MIZUKI_SIGNER_REVIEW_MAX_COST_MICROUNITS
        value: '1000000'
      - key: MIZUKI_JOB_AUTHORITY_PUBLIC_KEY
        sync: false
      - key: MIZUKI_REFUND_TREASURY
        sync: false
      - key: MIZUKI_ESCROW_AUTHORITY
        sync: false
      - key: MIZUKI_REFUND_MINT
        value: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
      - key: MIZUKI_REFUND_DECIMALS
        value: '6'
      - key: MIZUKI_REFUND_TOKEN_PROGRAM
        value: spl-token
      - key: MIZUKI_ESCROW_PROGRAM_ID
        sync: false
      - key: MIZUKI_ESCROW_PROGRAM_DATA_SHA256
        sync: false
      - key: MIZUKI_SOL_USD_PRICE_URL
        value: https://api.exchange.coinbase.com/products/SOL-USD/ticker
      - key: MIZUKI_SOL_USD_SECONDARY_PRICE_URL
        value: https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd&include_last_updated_at=true&precision=6
      - key: MIZUKI_SOL_USD_MAX_DIVERGENCE_BPS
        value: '500'
      - key: MIZUKI_SOL_USD_MAX_AGE_MS
        value: '300000'
      - key: MIZUKI_SOL_USD_MIN_MICROS
        value: '1000000'
      - key: MIZUKI_SOL_USD_MAX_MICROS
        value: '1000000000'
      - key: MIZUKI_OPERATION_LIMIT_USD_CENTS
        value: '2500'
      - key: MIZUKI_REFUND_DAILY_LIMIT_USD_CENTS
        value: '10000'
      - key: MIZUKI_REFUND_AUTH_MAX_TTL_SECONDS
        value: '900'
      - key: MIZUKI_ESCROW_DAILY_LIMIT_USD_CENTS
        value: '10000'
      - key: MIZUKI_MAX_ESCROW_LAMPORTS
        value: '1000000000'
      - key: MIZUKI_SOL_FEE_RESERVE_LAMPORTS
        value: '1000000'
      - key: MIZUKI_BIND_CHALLENGE_TTL_SECONDS
        value: '600'
      - key: MIZUKI_GITHUB_GRANT_TTL_SECONDS
        value: '600'
      - key: MIZUKI_CLAIM_TTL_SECONDS
        value: '172800'
      - key: MIZUKI_SIGNER_MOCK_MODE
        value: 'false'

  - type: pserv
    name: mizuki-coding-gateway
    runtime: node
    repo: https://github.com/open-covenant/covenant
    branch: main
    plan: starter
    region: frankfurt
    numInstances: 1
    autoDeploy: false
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @covenant/coding-gateway build
    startCommand: pnpm --filter @covenant/coding-gateway start
    disk:
      name: mizuki-coding-gateway-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8642
      - key: CODER_AUTH_TOKEN
        generateValue: true
      - key: CODER_BACKEND
        value: usepod
      - key: CODER_MODEL
        value: openai/gpt-oss-120b
      - key: CODER_EFFORT
        value: low
      - key: USEPOD_API_KEY
        sync: false
      - key: USEPOD_BASE_URL
        value: https://api.usepod.ai
      - key: USEPOD_INPUT_USD_PER_MILLION
        value: '0.2'
      - key: USEPOD_OUTPUT_USD_PER_MILLION
        value: '0.4'
      - key: USEPOD_MAX_INPUT_PRICE_MICROUNITS
        value: '200000'
      - key: USEPOD_MAX_OUTPUT_PRICE_MICROUNITS
        value: '400000'
      - key: USEPOD_MIN_BALANCE
        value: '4000000'
      - key: E2B_API_KEY
        sync: false
      - key: E2B_TEMPLATE_ID
        value: aaj2iho3gnyf5fcvln83
      - key: E2B_EXPECTED_CPU_COUNT
        value: '4'
      - key: E2B_EXPECTED_MEMORY_MB
        value: '4096'
      - key: E2B_EGRESS_ALLOW
        value: github.com,codeload.github.com,objects.githubusercontent.com,registry.npmjs.org,registry.yarnpkg.com,pypi.org,files.pythonhosted.org,crates.io,static.crates.io
      - key: CODER_DAILY_USD
        value: '25'
      - key: CODER_MONTHLY_USD
        value: '500'
      - key: CODER_PER_RUN_USD_MAX
        value: '4'
      - key: CODER_MAX_CONCURRENT
        value: '2'
      - key: CODER_WALL_MS
        value: '600000'
      - key: CODER_E2B_WORST_CASE_USD_PER_SEC
        value: '0.0002'
      - key: CODER_E2B_TARIFF_REF
        value: https://raw.githubusercontent.com/open-covenant/covenant/main/infra/mizuki/evidence/e2b-tariff-2026-08-23.json#sha256=6ef608ba7e084aa7eda89941e79ef93ef9b952c993772b0735b8dbde1910664d
      - key: CODER_READINESS_REFRESH_MS
        value: '120000'
      - key: CODER_READINESS_MAX_AGE_MS
        value: '300000'
      - key: CODER_READINESS_TIMEOUT_MS
        value: '20000'
      - key: CODER_IP_MAX_PER_IP
        value: '0'
      - key: TRUSTED_PROXY_HOPS
        value: '0'
      - key: LEDGER_PATH
        value: /var/data/spend-ledger.json
      - key: RUN_STORE_PATH
        value: /var/data/runs.json

  - type: pserv
    name: mizuki-updater
    runtime: node
    repo: https://github.com/open-covenant/covenant
    branch: main
    plan: starter
    region: frankfurt
    numInstances: 1
    autoDeploy: false
    maxShutdownDelaySeconds: 120
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @covenant/mizuki-updater build
    startCommand: pnpm --filter @covenant/mizuki-updater start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIZUKI_UPDATER_HOST
        value: 0.0.0.0
      - key: MIZUKI_UPDATER_PORT
        value: 8793
      - key: MIZUKI_UPDATER_SUBMIT_TOKEN
        generateValue: true
      - key: MIZUKI_UPDATER_CONTROL_TOKEN
        generateValue: true
      - key: MIZUKI_UPDATER_READ_TOKEN
        generateValue: true
      - key: MIZUKI_UPDATER_DATABASE_URL
        fromDatabase:
          name: mizuki-updater-postgres
          property: connectionString
      - key: MIZUKI_UPDATER_MEMORY_STORE
        value: 'false'
      - key: MIZUKI_UPDATER_PROPOSAL_KEYS_JSON
        sync: false
      - key: MIZUKI_UPDATER_BENCHMARK_KEYS_JSON
        sync: false
      - key: MIZUKI_UPDATER_REVIEW_KEYS_JSON
        sync: false
      - key: MIZUKI_UPDATER_ALLOWED_REPOSITORIES
        value: open-covenant/covenant
      - key: MIZUKI_UPDATER_ALLOWED_BASE_BRANCHES
        value: main
      - key: MIZUKI_UPDATER_HEAD_BRANCH_PREFIX
        value: mizuki/capability/
      - key: MIZUKI_UPDATER_MANDATORY_CHECKS
        value: application,escrow,rust,landing
      - key: MIZUKI_UPDATER_CHECK_PRODUCERS_JSON
        value: '{"application":{"checkRunAppId":15368,"workflowId":340541049,"workflowPath":".github/workflows/mizuki.yml","event":"pull_request","headBranch":"manifest","headSha":"candidate","baseBranch":"manifest","baseSha":"signed","definitionRef":"base"},"escrow":{"checkRunAppId":15368,"workflowId":340541049,"workflowPath":".github/workflows/mizuki.yml","event":"pull_request","headBranch":"manifest","headSha":"candidate","baseBranch":"manifest","baseSha":"signed","definitionRef":"base"},"rust":{"checkRunAppId":15368,"workflowId":265742803,"workflowPath":".github/workflows/ci.yml","event":"pull_request","headBranch":"manifest","headSha":"candidate","baseBranch":"manifest","baseSha":"signed","definitionRef":"base"},"landing":{"checkRunAppId":15368,"workflowId":265742803,"workflowPath":".github/workflows/ci.yml","event":"pull_request","headBranch":"manifest","headSha":"candidate","baseBranch":"manifest","baseSha":"signed","definitionRef":"base"}}'
      - key: MIZUKI_UPDATER_PROPOSAL_MAX_AGE_MS
        value: '604800000'
      - key: MIZUKI_UPDATER_ARTIFACT_ORIGINS
        value: https://github.com,https://release-assets.githubusercontent.com
      - key: MIZUKI_UPDATER_ARTIFACT_TIMEOUT_MS
        value: '30000'
      - key: MIZUKI_UPDATER_ARTIFACT_MAX_BYTES
        value: '26214400'
      - key: MIZUKI_UPDATER_GITHUB_API_URL
        value: https://api.github.com
      - key: MIZUKI_UPDATER_GITHUB_APP_ID
        sync: false
      - key: MIZUKI_UPDATER_GITHUB_PRIVATE_KEY
        sync: false
      - key: MIZUKI_UPDATER_GITHUB_TIMEOUT_MS
        value: '20000'
      - key: MIZUKI_UPDATER_GITHUB_MERGE_METHOD
        value: squash
      - key: MIZUKI_UPDATER_HOOK_TIMEOUT_MS
        value: '90000'
      - key: MIZUKI_UPDATER_CHECK_TIMEOUT_MS
        value: '1800000'
      - key: MIZUKI_UPDATER_HEALTH_TIMEOUT_MS
        value: '600000'
      - key: MIZUKI_UPDATER_PROMOTION_SOAK_MS
        value: '10000'
      - key: MIZUKI_UPDATER_PROMOTION_TIMEOUT_MS
        value: '120000'
      - key: MIZUKI_UPDATER_POLL_INTERVAL_MS
        value: '5000'
      - key: MIZUKI_UPDATER_LEASE_MS
        value: '180000'
      - key: MIZUKI_UPDATER_MAX_ATTEMPTS
        value: '10'

databases:
  - name: mizuki-signer-postgres
    databaseName: mizuki_signer
    user: mizuki_signer
    plan: basic-256mb
    diskSizeGB: 5
    storageAutoscalingEnabled: true
    connectionPool: none
    region: frankfurt
    postgresMajorVersion: '16'
    ipAllowList: []
  - name: mizuki-updater-postgres
    databaseName: mizuki_updater
    user: mizuki_updater
    plan: basic-256mb
    diskSizeGB: 5
    storageAutoscalingEnabled: true
    connectionPool: none
    region: frankfurt
    postgresMajorVersion: '16'
    ipAllowList: []
