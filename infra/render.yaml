services:
  - type: keyvalue
    name: covenant-redis
    plan: starter
    ipAllowList: []

  - type: worker
    name: covenant-proof-gen
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @covenant/proof-gen build
    startCommand: pnpm --filter @covenant/proof-gen start:worker
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: covenant-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

  - type: web
    name: covenant-mcp-bridge
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @covenant/mcp-bridge build
    startCommand: pnpm --filter @covenant/mcp-bridge start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: COVENANT_SOLANA_CLUSTER
        value: devnet
      - key: COVENANT_SOLANA_RPC_URL
        sync: false
      - key: COVENANT_SOLANA_WS_URL
        sync: false
      - key: COVENANT_PROTOCOL_PROGRAM_ID
        sync: false
      - key: COVNT_MINT
        sync: false
