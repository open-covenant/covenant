[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "covenant-blockrun"
version = "0.1.0"
description = "Covenant trust receipts for BlockRun x402 calls: wrap your client's transport, get a verifiable receipt binding requested model, served model, and settlement for every call."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["blockrun", "x402", "covenant", "agent", "receipt", "provenance"]

[project.urls]
Homepage = "https://opencovenant.org"
Repository = "https://github.com/open-covenant/covenant"

[tool.hatch.build.targets.wheel]
packages = ["src/covenant_blockrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
