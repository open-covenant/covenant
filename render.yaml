## Public sandbox deployment for the Covenant operator console.
##
## - covenant-sandbox-daemon: covenantd HTTP gateway, internal-only network.
## - covenant-sandbox-web: Next.js operator console, talks to the daemon
##   over Render's private network at http://covenant-sandbox-daemon:8421.
## - covenant-fairscale-bridge: public read-only HTTP service that maps the
##   daemon's audit-attested events into FairScale work_history conduct
##   events. FairScale pulls it with a bearer token (FAIRSCALE_API_TOKEN).
## - covenant-sandbox-reset: 12-hour cron that restarts the daemon via the
##   Render REST API so the sandbox stays clean.
##
## Shared secret COVENANT_OPERATOR_TOKEN lives in the env group below.

services:
  - type: pserv
    name: covenant-sandbox-daemon
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: .
    dockerfilePath: ./deploy/Dockerfile.daemon
    dockerContext: .
    # The daemon image only depends on the Rust workspace and the deploy
    # scripts; without this filter every push to main (landing, fairscale,
    # docs) triggers a ~12 min cold rebuild that supersedes the previous one.
    buildFilter:
      paths:
        - agent-os/**
        - deploy/**
    disk:
      name: covenant-sandbox-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: COVENANT_HTTP_PORT
        value: "8421"
      - key: COVENANT_HTTP_BIND_ADDR
        value: "0.0.0.0"
      - key: COVENANT_SAP_RPC_URL
        sync: false  # OOBE/Synapse SAP RPC URL incl. api_key; set in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # coding gateway + demo agent model key; set value in dashboard
      - key: OPENAI_API_KEY
        sync: false  # coding gateway (Codex backend) model key; set value in dashboard
      - key: E2B_API_KEY
        sync: false  # coding gateway ephemeral sandbox provider; set value in dashboard
      - key: HERMES_API_BASE_URL
        value: http://covenant-coding-gateway:10000/v1  # gateway binds Render's $PORT=10000; delegates + seeds the coder agent
      - key: COVENANT_LIVE_TRACE
        value: "1"  # publish runtime traces to the broadcast fan-out the web SSE endpoint (`/intents/:id/events`) subscribes to; without this the watch-it-work view sees zero frames and flips to "disconnected" when an upstream proxy timeout closes the silent stream
      - fromGroup: covenant-sandbox-shared

  - type: web
    name: covenant-sandbox-web
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: agent-os/covenant-web
    buildCommand: pnpm install --ignore-workspace --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "1"
      - key: NEXT_PUBLIC_DEMO_RESET_INTERVAL_HOURS
        value: "12"
      - key: COVENANT_DAEMON_URL
        value: http://covenant-sandbox-daemon:8421
      # Synapse Agent Protocol bridge — read-only on the web side. The
      # daemon does not hold a signer here, so the page renders the
      # resolved status + the published agent's explorer links.
      - key: COVENANT_SAP_ENABLED
        value: "1"
      - key: COVENANT_SOLANA_CLUSTER
        value: devnet
      - key: COVENANT_SAP_AGENT_PDA
        value: B86uVNTwuKS9cjtbLJR8NNp8WGmcYzPgvVCFx8BE8cpy
      - key: COVENANT_SAP_RPC_URL
        sync: false  # OOBE/Synapse SAP RPC URL incl. api_key; set in dashboard
      - fromGroup: covenant-sandbox-shared

  # NOTE: the public landing (opencovenant.org) is served by the standalone
  # `covenant-web` service (rootDir: landing), configured outside this blueprint.
  # It carries AGENT_INGEST_TOKEN for the live build-terminal feed and must stay
  # a SINGLE instance (the SSE bus is in-process).

  - type: web
    name: covenant-fairscale-bridge
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: services/fairscale-bridge
    buildCommand: pnpm install --ignore-workspace --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: COVENANT_DAEMON_URL
        value: http://covenant-sandbox-daemon:8421
      # bearer token FairScale presents to pull conduct events; set in
      # dashboard or via the Render API, never committed.
      - key: FAIRSCALE_API_TOKEN
        sync: false
      - fromGroup: covenant-sandbox-shared

  # Coding gateway: Hermes /v1-compatible service that runs the pluggable coding
  # agent in an ephemeral sandbox. PRIVATE (pserv) — only the daemon calls it; a
  # public URL would bypass the daemon's auth/budget/abuse controls.
  - type: pserv
    name: covenant-coding-gateway
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: services/coding-gateway
    buildCommand: pnpm install --ignore-workspace --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /v1/capabilities
    buildFilter:
      paths:
        - services/coding-gateway/**
    envVars:
      - key: NODE_VERSION
        value: "20"
      # No PORT override — the service binds Render's $PORT (10000) and is
      # reachable internally at covenant-coding-gateway:10000.
      - key: CODER_MODEL
        value: claude-sonnet-4-6  # public default; Opus is the gated tier
      - key: CODER_DAILY_USD
        value: "6"
      - key: CODER_MONTHLY_USD
        value: "200"
      - key: ANTHROPIC_API_KEY
        sync: false  # set via Render API after first deploy
      - key: OPENAI_API_KEY
        sync: false  # codex backend (coder-05)
      - key: E2B_API_KEY
        sync: false  # ephemeral sandbox provider

  # Settlement publisher: tails the daemon's audit feed and posts a
  # `consume_credits` transaction on devnet for each dispatched intent so
  # the sandbox demonstrates real, verifiable on-chain settlement tied
  # to visible coding tasks. Private service: only the web consumes its
  # /sigs join table; visitors never hit this directly.
  - type: pserv
    name: covenant-settlement-publisher
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: services/settlement-publisher
    buildCommand: npm install --no-fund --no-audit
    startCommand: node src/index.mjs
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - services/settlement-publisher/**
    disk:
      name: settlement-publisher-data
      mountPath: /data/settlement-publisher
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: COVENANT_DAEMON_URL
        value: http://covenant-sandbox-daemon:8421
      - key: COVENANT_SOLANA_CLUSTER
        value: devnet
      - key: COVENANT_SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: COVENANT_SETTLEMENT_PROGRAM_ID
        value: cov9UDypG7nsryxdgMcKhKU2spRVWLVjxT2iTv6do5Y
      - key: COVENANT_SETTLEMENT_CONFIG
        value: BGGx99dV5LU2GpKCmhXqT1mi1yNr8EuMuMd5BAG7Lcvi
      - key: COVENANT_SETTLEMENT_CREDIT_ACCOUNT
        value: AM3LpxSGVjCnZqHJN9YEZs2VQUd5dnrf5QJtRav53uB8
      - key: SETTLE_STATE_DIR
        value: /data/settlement-publisher
      # raw [u8;64] keypair JSON for the operator wallet
      # (AdChcSmDKX57rU9qChMJ3MKnqNZbmiQAjuns9VCjzqRb), set in dashboard.
      - key: COVENANT_OPERATOR_KEYPAIR_JSON
        sync: false
      - fromGroup: covenant-sandbox-shared

  # Telegram bot: posts a "NEW STAKE" message to a group whenever a $CVNT
  # PositionCreated event lands on-chain, plus the deny-by-default /status +
  # /tasks command surface. Private service — it long-polls the Telegram API
  # and pushes announcements out; nothing calls it inbound. The signature
  # cursor lives on the attached disk so a restart never replays or skips.
  - type: pserv
    name: covenant-telegram-bot
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: services/telegram-bot
    buildCommand: pnpm install --ignore-workspace --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - services/telegram-bot/**
    disk:
      name: telegram-bot-data
      mountPath: /data/telegram-bot
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COVENANT_SOLANA_CLUSTER
        value: mainnet
      # Use a real RPC — the public mainnet endpoint rate-limits polling.
      - key: COVENANT_SOLANA_RPC_URL
        sync: false
      - key: COVNT_MINT
        value: 2mNVZ6aEjrGwiUVCfz7XGWpiXuWzgBDoznwE579upump
      - key: COVENANT_TOKEN_SYMBOL
        value: CVNT
      # Bot-owned custom emoji rendered as the bar instead of 🔥 (cvnt_by_CovenantStakeBot).
      - key: STAKE_ANNOUNCE_EMOJI_ID
        value: "5841217997154295453"
      # Header banner on each post: `bundled` ships the committed Covenant banner.
      - key: STAKE_ANNOUNCE_HEADER_PHOTO
        value: bundled
      - key: STAKE_WATCHER_STATE_DIR
        value: /data/telegram-bot
      # BotFather token; set in the dashboard, never committed.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Target group/channel id, e.g. -1001234567890.
      - key: TELEGRAM_ANNOUNCE_CHAT_ID
        sync: false
      # Comma-separated numeric ids allowed to run /status, /tasks, /stakepreview.
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false

  - type: cron
    name: covenant-sandbox-reset
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 */12 * * *"
    rootDir: .
    buildCommand: ""
    startCommand: |
      curl -fsSL "https://api.render.com/v1/services/$DAEMON_SVC_ID/restart" \
           -X POST \
           -H "Authorization: Bearer $RENDER_API_KEY" \
        || echo "restart trigger failed; sandbox will reset on next deploy"
    envVars:
      - key: DAEMON_SVC_ID
        sync: false  # paste the daemon service id after first deploy
      - key: RENDER_API_KEY
        sync: false  # team-scoped Render API key

envVarGroups:
  - name: covenant-sandbox-shared
    envVars:
      - key: COVENANT_OPERATOR_TOKEN
        value: BZgM5nHPW11ATBMMNunZj5Q2tWqwgqbwkMNLgmb8FJ3X
