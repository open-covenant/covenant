## Two-service deployment for the Covenant public sandbox.
##
## - covenant-demo-daemon: covenantd HTTP gateway, internal-only network.
## - covenant-demo-web: Next.js operator console, talks to the daemon
##   over the Render private network at http://covenant-demo-daemon:8421.
## - covenant-demo-reset: 12-hour cron that restarts the daemon via the
##   Render REST API so the sandbox stays clean.
##
## Shared secret COVENANT_OPERATOR_TOKEN is injected from the env group below.

services:
  - type: pserv
    name: covenant-demo-daemon
    runtime: docker
    plan: starter
    region: oregon
    autoDeploy: true
    rootDir: .
    dockerfilePath: ./deploy/Dockerfile.daemon
    dockerContext: .
    disk:
      name: covenant-demo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: COVENANT_HTTP_PORT
        value: "8421"
      - key: COVENANT_HTTP_BIND_ADDR
        value: "0.0.0.0"
      - fromGroup: covenant-demo-shared

  - type: web
    name: covenant-demo-web
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    rootDir: agent-os/covenant-web
    buildCommand: pnpm install --ignore-workspace --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "1"
      - key: COVENANT_DAEMON_URL
        value: http://covenant-demo-daemon:8421
      - fromGroup: covenant-demo-shared

  - type: cron
    name: covenant-demo-reset
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 */12 * * *"
    rootDir: .
    buildCommand: ""
    startCommand: |
      curl -fsSL "https://api.render.com/v1/services/$DAEMON_SVC_ID/restart" \
           -X POST \
           -H "Authorization: Bearer $RENDER_API_KEY" \
        || echo "restart trigger failed; sandbox will reset on next deploy"
    envVars:
      - key: DAEMON_SVC_ID
        sync: false  # paste the daemon service id after first deploy
      - key: RENDER_API_KEY
        sync: false  # team-scoped Render API key

envVarGroups:
  - name: covenant-demo-shared
    envVars:
      - key: COVENANT_OPERATOR_TOKEN
        generateValue: true  # Render mints a random value once and pins it
