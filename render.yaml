## Public sandbox deployment for the Covenant operator console.
##
## - covenant-sandbox-daemon: covenantd HTTP gateway, internal-only network.
## - covenant-sandbox-web: Next.js operator console, talks to the daemon
##   over Render's private network at http://covenant-sandbox-daemon:8421.
## - covenant-fairscale-bridge: public read-only HTTP service that maps the
##   daemon's audit-attested events into FairScale work_history conduct
##   events. FairScale pulls it with a bearer token (FAIRSCALE_API_TOKEN).
## - covenant-sandbox-reset: 12-hour cron that restarts the daemon via the
##   Render REST API so the sandbox stays clean.
##
## Shared secret COVENANT_OPERATOR_TOKEN lives in the env group below.

services:
  - type: pserv
    name: covenant-sandbox-daemon
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: .
    dockerfilePath: ./deploy/Dockerfile.daemon
    dockerContext: .
    # The daemon image only depends on the Rust workspace and the deploy
    # scripts; without this filter every push to main (landing, fairscale,
    # docs) triggers a ~12 min cold rebuild that supersedes the previous one.
    buildFilter:
      paths:
        - agent-os/**
        - deploy/**
    disk:
      name: covenant-sandbox-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: COVENANT_HTTP_PORT
        value: "8421"
      - key: COVENANT_HTTP_BIND_ADDR
        value: "0.0.0.0"
      - key: COVENANT_SAP_RPC_URL
        sync: false  # OOBE/Synapse SAP RPC URL incl. api_key; set in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # coding gateway + demo agent model key; set value in dashboard
      - key: OPENAI_API_KEY
        sync: false  # coding gateway (Codex backend) model key; set value in dashboard
      - key: E2B_API_KEY
        sync: false  # coding gateway ephemeral sandbox provider; set value in dashboard
      - key: HERMES_API_BASE_URL
        value: http://covenant-coding-gateway:10000/v1  # gateway binds Render's $PORT=10000; delegates + seeds the coder agent
      - key: COVENANT_LIVE_TRACE
        value: "1"  # publish runtime traces to the broadcast fan-out the web SSE endpoint (`/intents/:id/events`) subscribes to; without this the watch-it-work view sees zero frames and flips to "disconnected" when an upstream proxy timeout closes the silent stream
      - fromGroup: covenant-sandbox-shared

  - type: web
    name: covenant-sandbox-web
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: agent-os/covenant-web
    buildCommand: pnpm install --ignore-workspace --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "1"
      - key: NEXT_PUBLIC_DEMO_RESET_INTERVAL_HOURS
        value: "12"
      - key: COVENANT_DAEMON_URL
        value: http://covenant-sandbox-daemon:8421
      # Synapse Agent Protocol bridge — read-only on the web side. The
      # daemon does not hold a signer here, so the page renders the
      # resolved status + the published agent's explorer links.
      - key: COVENANT_SAP_ENABLED
        value: "1"
      - key: COVENANT_SOLANA_CLUSTER
        value: devnet
      - key: COVENANT_SAP_AGENT_PDA
        value: B86uVNTwuKS9cjtbLJR8NNp8WGmcYzPgvVCFx8BE8cpy
      - key: COVENANT_SAP_RPC_URL
        sync: false  # OOBE/Synapse SAP RPC URL incl. api_key; set in dashboard
      - fromGroup: covenant-sandbox-shared

  - type: web
    name: covenant-fairscale-bridge
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: services/fairscale-bridge
    buildCommand: pnpm install --ignore-workspace --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: COVENANT_DAEMON_URL
        value: http://covenant-sandbox-daemon:8421
      # bearer token FairScale presents to pull conduct events; set in
      # dashboard or via the Render API, never committed.
      - key: FAIRSCALE_API_TOKEN
        sync: false
      - fromGroup: covenant-sandbox-shared

  # Coding gateway: Hermes /v1-compatible service that runs the pluggable coding
  # agent in an ephemeral sandbox. PRIVATE (pserv) — only the daemon calls it; a
  # public URL would bypass the daemon's auth/budget/abuse controls.
  - type: pserv
    name: covenant-coding-gateway
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    rootDir: services/coding-gateway
    buildCommand: pnpm install --ignore-workspace --frozen-lockfile=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /v1/capabilities
    buildFilter:
      paths:
        - services/coding-gateway/**
    envVars:
      - key: NODE_VERSION
        value: "20"
      # No PORT override — the service binds Render's $PORT (10000) and is
      # reachable internally at covenant-coding-gateway:10000.
      - key: CODER_MODEL
        value: claude-sonnet-4-6  # public default; Opus is the gated tier
      - key: CODER_DAILY_USD
        value: "6"
      - key: CODER_MONTHLY_USD
        value: "200"
      - key: ANTHROPIC_API_KEY
        sync: false  # set via Render API after first deploy
      - key: OPENAI_API_KEY
        sync: false  # codex backend (coder-05)
      - key: E2B_API_KEY
        sync: false  # ephemeral sandbox provider

  - type: cron
    name: covenant-sandbox-reset
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 */12 * * *"
    rootDir: .
    buildCommand: ""
    startCommand: |
      curl -fsSL "https://api.render.com/v1/services/$DAEMON_SVC_ID/restart" \
           -X POST \
           -H "Authorization: Bearer $RENDER_API_KEY" \
        || echo "restart trigger failed; sandbox will reset on next deploy"
    envVars:
      - key: DAEMON_SVC_ID
        sync: false  # paste the daemon service id after first deploy
      - key: RENDER_API_KEY
        sync: false  # team-scoped Render API key

envVarGroups:
  - name: covenant-sandbox-shared
    envVars:
      - key: COVENANT_OPERATOR_TOKEN
        value: BZgM5nHPW11ATBMMNunZj5Q2tWqwgqbwkMNLgmb8FJ3X
