[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant-compute-x402"
version = "0.1.0"
description = "Bounded, verified Solana USDC inference purchases for Python agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "x402[svm]==2.25.0", "solana==0.39.0", "solders==0.27.1",
  "httpx2==2.14.0", "jcs==0.2.1",
]

[project.optional-dependencies]
agent-framework = ["agent-framework-core==1.22.0"]
demo = ["agent-framework-core==1.22.0", "agent-framework-openai==1.17.0"]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "build==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
covenant_compute_x402 = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
