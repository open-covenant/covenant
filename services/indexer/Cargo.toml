[package]
name = "covenant-indexer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fixture HTTP shell for Covenant Solana program events. Real Solana RPC ingestion is deferred until the on-chain shape stabilizes; see README for the wiring path."

[lib]
name = "covenant_indexer"
path = "src/lib.rs"

[[bin]]
name = "covenant-indexer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1.0"
wiremock = "0.6"
