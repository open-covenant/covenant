services:
  - type: web
    name: covenant-solana-indexer
    runtime: docker
    plan: starter
    dockerfilePath: services/indexer/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: COVENANT_SOLANA_RPC_URL
        sync: false
      - key: COVENANT_SOLANA_CLUSTER
        value: devnet
      - key: COVENANT_PROTOCOL_PROGRAM_ID
        sync: false
      - key: INDEXER_BIND_ADDR
        value: 0.0.0.0:8080
      - key: RUST_LOG
        value: info
