services:
  - type: web
    name: covenant-solana-indexer
    runtime: docker
    plan: starter
    dockerfilePath: services/indexer/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: COVENANT_SOLANA_RPC_URL
        sync: false
      - key: COVENANT_SOLANA_CLUSTER
        value: devnet
      - key: COVENANT_PROTOCOL_PROGRAM_ID
        sync: false
      - key: INDEXER_BIND_ADDR
        value: 0.0.0.0:8080
      - key: RUST_LOG
        value: info
      # Covenant Verified: hex 32-byte Ed25519 issuer seed. When set, the
      # service attests zauth's directory at GET /verified. Value lives in
      # the dashboard, not the blueprint.
      - key: COVENANT_VERIFIED_ISSUER_SEED
        sync: false
      - key: COVENANT_VERIFIED_LIMIT
        value: "50"
