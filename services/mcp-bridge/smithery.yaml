name: "@covenant/mcp-bridge"
description: MCP server for Covenant's Solana-native protocol and local daemon surfaces
version: 0.2.0

startCommand: "npx @covenant/mcp-bridge"

tools:
  - name: get_network
    description: Return Solana network metadata
  - name: list_agents
    description: List registered agents
  - name: list_tasks
    description: List task escrow records
  - name: prepare_register_agent
    description: Prepare an agent-registration instruction descriptor
  - name: prepare_buy_credits
    description: Prepare a credit-purchase instruction descriptor
  - name: prepare_stake
    description: Prepare a stake instruction descriptor
  - name: prepare_create_task
    description: Prepare a task escrow instruction descriptor
  - name: prepare_anchor_receipt_batch
    description: Prepare a receipt-root anchoring descriptor
  - name: daemon_tools_list
    description: List tools registered in the local Covenant daemon
  - name: daemon_submit_intent
    description: Submit an intent through the local Covenant daemon
  - name: daemon_chain_status
    description: Read Covenant chain configuration status from the daemon

env:
  COVENANT_SOLANA_CLUSTER:
    description: Solana cluster label
    type: string
    enum: [localnet, devnet, mainnet]
    default: devnet
    required: false
  COVENANT_SOLANA_RPC_URL:
    description: Solana RPC endpoint URL
    type: string
    required: false
  COVENANT_SOLANA_WS_URL:
    description: Solana websocket endpoint URL
    type: string
    required: false
  COVENANT_PROTOCOL_PROGRAM_ID:
    description: Covenant protocol program id
    type: string
    required: false
  COVNT_MINT:
    description: External COVNT SPL mint address
    type: string
    required: false
  COVENANT_HTTP_URL:
    description: Covenant daemon HTTP gateway URL
    type: string
    default: http://127.0.0.1:8421
    required: false
  COVENANT_AUTH_TOKEN:
    description: Bearer token for daemon-backed tools
    type: string
    required: false
    secret: true
